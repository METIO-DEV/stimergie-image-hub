services:
  app:
    build:
      context: .
    env_file:
      - ./.env
    environment:
      APP_URL: http://localhost:${APP_HOST_PORT:-8100}
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: 5432
      DB_DATABASE: stimergie_image_hub
      DB_USERNAME: stimergie
      DB_PASSWORD: stimergie
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      MAIL_MAILER: smtp
      MAIL_SCHEME: null
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: null
      MAIL_PASSWORD: null
      BREVO_TEMPLATE_MAILER: laravel
      VITE_DEV_SERVER_URL: http://localhost:${VITE_HOST_PORT:-5174}
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    ports:
      - "${APP_HOST_PORT:-8100}:8000"
    volumes:
      - .:/var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000

  queue:
    build:
      context: .
    env_file:
      - ./.env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: 5432
      DB_DATABASE: stimergie_image_hub
      DB_USERNAME: stimergie
      DB_PASSWORD: stimergie
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      MAIL_MAILER: smtp
      MAIL_SCHEME: null
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: null
      MAIL_PASSWORD: null
      BREVO_TEMPLATE_MAILER: laravel
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    volumes:
      - .:/var/www/html
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=0

  queue-sync:
    build:
      context: .
    env_file:
      - ./.env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: 5432
      DB_DATABASE: stimergie_image_hub
      DB_USERNAME: stimergie
      DB_PASSWORD: stimergie
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      MAIL_MAILER: smtp
      MAIL_SCHEME: null
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: null
      MAIL_PASSWORD: null
      BREVO_TEMPLATE_MAILER: laravel
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    volumes:
      - .:/var/www/html
    command: php artisan queue:work --queue=sync --sleep=1 --tries=1 --timeout=0

  migrate:
    build:
      context: .
    env_file:
      - ./.env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: 5432
      DB_DATABASE: stimergie_image_hub
      DB_USERNAME: stimergie
      DB_PASSWORD: stimergie
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
    depends_on:
      pgsql:
        condition: service_healthy
    volumes:
      - .:/var/www/html
    command: php artisan migrate --force --no-interaction

  vite:
    image: node:22-alpine
    working_dir: /var/www/html
    environment:
      APP_HOST_PORT: ${APP_HOST_PORT:-8100}
      VITE_HOST_PORT: ${VITE_HOST_PORT:-5174}
    ports:
      - "${VITE_HOST_PORT:-5174}:5173"
    volumes:
      - .:/var/www/html
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0"

  pgsql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stimergie_image_hub
      POSTGRES_USER: stimergie
      POSTGRES_PASSWORD: stimergie
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stimergie -d stimergie_image_hub"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "${MAILPIT_UI_HOST_PORT:-8025}:8025"

volumes:
  pgsql-data:
