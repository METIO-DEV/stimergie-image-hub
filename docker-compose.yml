services:
  app:
    build:
      context: ./laravel
    env_file:
      - ./laravel/.env
    environment:
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: 5432
      DB_DATABASE: stimergie_image_hub
      DB_USERNAME: stimergie
      DB_PASSWORD: stimergie
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      VITE_DEV_SERVER_URL: http://localhost:5173
    depends_on:
      pgsql:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./laravel:/var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000

  queue:
    build:
      context: ./laravel
    env_file:
      - ./laravel/.env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: 5432
      DB_DATABASE: stimergie_image_hub
      DB_USERNAME: stimergie
      DB_PASSWORD: stimergie
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
    depends_on:
      pgsql:
        condition: service_healthy
    volumes:
      - ./laravel:/var/www/html
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=120

  vite:
    image: node:22-alpine
    working_dir: /var/www/html
    ports:
      - "5173:5173"
    volumes:
      - ./laravel:/var/www/html
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0"

  pgsql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stimergie_image_hub
      POSTGRES_USER: stimergie
      POSTGRES_PASSWORD: stimergie
    ports:
      - "5432:5432"
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stimergie -d stimergie_image_hub"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgsql-data:
